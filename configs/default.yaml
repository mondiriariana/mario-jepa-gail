# Default configuration. Every run saves the resolved config next to its checkpoints.
seed: 0

data:
  features: ${MJG_ROOT}/features/vjepa2_l_c8s2_g4   # expanded from the environment
  subjects: [sub-01]
  heldout_sessions_every: 6   # every 6th session of the subject (by order) is held out
  max_train_plays: 0          # 0 = all available

model:
  zdim: 1024
  n_tokens: 16
  d: 256
  hidden: 256
  adapter_layers: 2
  pred_layers: 2
  horizon: 4                  # JEPA target = latent K steps (16 frames, the next disjoint clip) ahead
  use_jepa: true
  imagination: true           # policy reads predictor's imagined consequence of each action
  imagination_mode: gated     # gated (v1, used by the first runs) | mlp (v2)

bc:
  steps: 10000
  batch: 512
  lr: 3.0e-4
  weight_decay: 0.05
  jepa_lambda: 1.0            # lambda for L_JEPA during BC warm start (0 or use_jepa=false -> BC only)
  label_smoothing: 0.05
  eval_every: 500

gail:
  iterations: 500
  n_envs: 16
  rollout: 128                # steps per env per iteration
  max_episode_steps: 1500     # 100 s of game time
  gamma: 0.99
  gae_lambda: 0.95
  ppo_epochs: 4
  minibatch: 512
  clip: 0.2
  lr: 5.0e-5
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  jepa_lambda: 1.0            # lambda in L = L_GAIL + lambda L_JEPA
  jepa_agent_frac: 0.5        # share of each JEPA batch drawn from the agent's own rollouts
  bc_coef: 0.0                # optional BC regulariser on demos during GAIL
  disc_lr: 1.0e-4
  disc_steps: 4
  disc_batch: 512
  disc_grad_pen: 1.0
  reward_clip: 10.0
  levels: auto                # auto = training-demo levels, sampled by demo frequency
  save_every: 25
  traj_save_every: 50
